<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحاسبة تحت التحديث - الجامعة الأردنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3E9;
    --paper-2:#EFE8D6;
    --ink:#242920;
    --ink-soft:#5B6154;
    --green:#1E4638;
    --green-deep:#0F2A21;
    --gold:#B48A34;
    --gold-soft:#DCC386;
    --line:#C9BE9F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Cairo',Tahoma,Arial,sans-serif;
    line-height:1.7;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  body.lang-en{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;}

  .card{
    max-width:480px;
    width:100%;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:36px 28px;
    text-align:center;
    box-shadow:0 10px 30px rgba(15,42,33,0.08);
  }

  .seal{
    width:64px;height:auto;
    margin:0 auto 20px;
    display:block;
  }

  .lang-toggle{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:22px;
  }
  .lang-toggle button{
    font-family:'Cairo',sans-serif;
    background:var(--paper-2);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:600;
    padding:6px 16px;
    border-radius:20px;
    cursor:pointer;
  }
  .lang-toggle button.active{
    background:var(--green-deep);
    color:#fff;
    border-color:var(--green-deep);
  }

  .icon{
    font-size:38px;
    margin-bottom:14px;
    display:block;
  }

  .eyebrow{
    color:var(--gold);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.4px;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  h1{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 14px;
    color:var(--green-deep);
    line-height:1.4;
  }
  p{
    margin:0 0 12px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .note{
    background:var(--paper-2);
    border-inline-start:3px solid var(--gold);
    padding:14px 16px;
    border-radius:3px;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:20px;
    text-align:start;
  }
  .credit{
    margin-top:26px;
    font-size:11.5px;
    color:#B5AF98;
  }
</style>
</head>
<body class="lang-ar">

<div class="card">
  <div class="lang-toggle">
    <button type="button" id="btnAr" class="active">عربي</button>
    <button type="button" id="btnEn">English</button>
  </div>

<script>
const dict = {
  ar: {
    pageTitle: "الحاسبة تحت التحديث - الجامعة الأردنية",
    eyebrow: "الجامعة الأردنية",
    title: "الحاسبة قيد التحديث مؤقتًا 🛠️",
    body1: "نعمل حاليًا على تحديث بعض الأرقام في حاسبة علامة اللغة الإنجليزية لضمان دقتها الكاملة.",
    body3: "جاري حاليًا إضافة العلامات المحدّثة الجديدة.",
    body2: "الحاسبة ستعود للعمل قريبًا. شكرًا لصبركم!",
    note: "ملاحظة: هذه أداة غير رسمية لتقدير العلامة فقط، وليست بديلاً عن التأكد من علامتك الرسمية مع مركز اللغات."
  },
  en: {
    pageTitle: "Calculator Under Update - University of Jordan",
    eyebrow: "University of Jordan",
    title: "Calculator Temporarily Under Update 🛠️",
    body1: "We're currently updating some of the figures in the English grade calculator to make sure everything is fully accurate.",
    body3: "I'm currently in the process of adding the new updated marks.",
    body2: "It'll be back up again soon. Thanks for your patience!",
    note: "Note: this is an unofficial estimation tool only, and not a substitute for confirming your official grade with the Language Center."
  }
};

let lang = 'ar';
const btnAr = document.getElementById('btnAr');
const btnEn = document.getElementById('btnEn');

function applyLanguage(){
  const t = dict[lang];
  document.title = t.pageTitle;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('lang-en', lang === 'en');
  document.body.classList.toggle('lang-ar', lang === 'ar');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(t[key] !== undefined) el.textContent = t[key];
  });
  btnAr.classList.toggle('active', lang === 'ar');
  btnEn.classList.toggle('active', lang === 'en');
}

btnAr.addEventListener('click', () => { lang = 'ar'; applyLanguage(); });
btnEn.addEventListener('click', () => { lang = 'en'; applyLanguage(); });
applyLanguage();
</script>
